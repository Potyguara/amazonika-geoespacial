services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-amazonika_geo}
      POSTGRES_USER: ${POSTGRES_USER:-amazonika}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-amazonika_local}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-amazonika} -d ${POSTGRES_DB:-amazonika_geo}"]
      interval: 5s
      timeout: 5s
      retries: 15

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-amazonika}:${POSTGRES_PASSWORD:-amazonika_local}@db:5432/${POSTGRES_DB:-amazonika_geo}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:4173}
      STORAGE_DIR: /data/uploads
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      GOOGLE_MAP_TILES_ENABLED: ${GOOGLE_MAP_TILES_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-6-luna}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - uploads_data:/data/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgis_data:
  uploads_data:
