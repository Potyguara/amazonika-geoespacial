# Nginx exclusivo de homologacao PS4, executado como UID/GID 101.
# Nao afeta o nginx do host, nem os ambientes de producao.
worker_processes auto;
pid /tmp/ps4_nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;

    client_body_temp_path /tmp/ps4_client_temp;
    proxy_temp_path /tmp/ps4_proxy_temp;
    fastcgi_temp_path /tmp/ps4_fastcgi_temp;
    uwsgi_temp_path /tmp/ps4_uwsgi_temp;
    scgi_temp_path /tmp/ps4_scgi_temp;

    include /etc/nginx/conf.d/*.conf;
}
