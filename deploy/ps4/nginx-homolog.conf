# SOMENTE ambiente PS4 de homologacao, porta Docker 127.0.0.1:13140.
# O navegador utiliza a mesma origem para sessao HttpOnly e tiles OpenLayers.
server {
    listen 8080;
    server_name localhost 127.0.0.1;
    client_max_body_size 270m;
    # Resolver interno do Docker; evita IP antigo após recriar api/web.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    set $ps4_api_upstream api:8000;
    set $ps4_web_upstream web:3000;
    # Caminhos graváveis para Nginx sem privilégios (CAP_DROP ALL).
    client_body_temp_path /tmp/ps4_client_temp;
    proxy_temp_path /tmp/ps4_proxy_temp;

    location /api/ {
        proxy_pass http://$ps4_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering on;
        add_header Cache-Control "no-store" always;
    }

    location / {
        proxy_pass http://$ps4_web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
