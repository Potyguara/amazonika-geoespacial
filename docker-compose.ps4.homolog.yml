# Exclusivo para testes PS4: NÃO mesclar com o compose de produção.
# Execução: docker compose -p amazonika-ps4-homolog --env-file .env.ps4.homolog -f docker-compose.ps4.homolog.yml up -d db api
name: amazonika-ps4-homolog

services:
  db:
    image: postgis/postgis:16-3.4
    restart: "no"
    environment:
      POSTGRES_DB: ps4_homolog
      POSTGRES_USER: ps4_homolog
      POSTGRES_PASSWORD: ${PS4_DB_PASSWORD:?Defina PS4_DB_PASSWORD no arquivo privado de homologacao}
    volumes:
      - ps4_db:/var/lib/postgresql/data
    networks:
      - ps4_private
    mem_limit: 768m
    cpus: 0.5
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ps4_homolog -d ps4_homolog"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    image: ${PS4_IMAGE:-amazonika-ps4-candidato:l4-fix-20261116}
    restart: "no"
    environment:
      DATABASE_URL: postgresql+psycopg://ps4_homolog:${PS4_DB_PASSWORD:?Defina PS4_DB_PASSWORD}@db:5432/ps4_homolog
      STORAGE_DIR: /data/uploads
      PB1_ARTICULATION_GEOJSON: /data/reference/pb1_amapa.geojson
      CORS_ORIGINS: http://127.0.0.1:13140,http://localhost:13140
      PUBLIC_BASE_URL: http://127.0.0.1:18140
      GOOGLE_MAP_TILES_ENABLED: "false"
      MAPBOX_SATELLITE_ENABLED: "false"
    ports:
      - "127.0.0.1:18140:8000"
    volumes:
      - ps4_uploads:/data/uploads
      - ./deploy/pb1/articulacao_amapa_25k_pb1.geojson:/data/reference/pb1_amapa.geojson:ro
    networks:
      - ps4_private
      - ps4_egress
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 1024m
    cpus: 0.75
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  worker:
    image: ${PS4_IMAGE:-amazonika-ps4-candidato:l4-fix-20261116}
    command: ["python", "-m", "app.workers.package_worker"]
    # A imagem da API possui um healthcheck HTTP /ready que não se aplica
    # a um processo de fila sem servidor HTTP.
    healthcheck:
      disable: true
    restart: "no"
    profiles: ["worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://ps4_homolog:${PS4_DB_PASSWORD:?Defina PS4_DB_PASSWORD}@db:5432/ps4_homolog
      STORAGE_DIR: /data/uploads
      CORS_ORIGINS: http://127.0.0.1:13140
    volumes:
      - ps4_uploads:/data/uploads
    networks:
      - ps4_private
      - ps4_egress
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 1024m
    cpus: 0.75
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  web:
    image: ${PS4_WEB_IMAGE:-amazonika-web-ps4:homolog-20261116}
    restart: "no"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: /api/v1
      HOST: 0.0.0.0
      PORT: "3000"
    networks:
      - ps4_egress
    mem_limit: 1024m
    cpus: 0.75
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  gateway:
    image: nginx:1.27-alpine
    restart: "no"
    # O nginx padrão tenta chown de /var/cache quando inicia como root.
    # Sem CAP_CHOWN, isso falha. UID/GID nginx e PID em /tmp evitam
    # elevar privilégios, preservando cap_drop ALL.
    user: "101:101"
    command: ["nginx", "-g", "daemon off;"]
    ports:
      - "127.0.0.1:13140:8080"
    volumes:
      - ./deploy/ps4/nginx-main.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/ps4/nginx-homolog.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - ps4_private
      - ps4_egress
    depends_on:
      - api
      - web
    mem_limit: 128m
    cpus: 0.25
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

networks:
  ps4_private:
    internal: true
  ps4_egress:

volumes:
  ps4_db:
  ps4_uploads:
