name: Topcon GNSS - validacao do perimetro
on:
  push:
    branches:
      - feat/topcon-ods-planta-memorial-20261114
    paths:
      - "backend/app/services/topcon_perimeter_review.py"
      - "backend/tests/test_topcon_perimeter_review.py"
      - "backend/app/services/sigef_parcel_review.py"
      - "backend/tests/test_sigef_parcel_review.py"
      - "backend/app/services/sigef_ods_reviewed.py"
      - "backend/tests/test_sigef_ods_reviewed.py"
      - "backend/app/services/vertical_datum.py"
      - "backend/tests/test_vertical_datum.py"
      - "backend/app/api/routes/technical_pieces.py"
      - ".github/workflows/topcon-perimeter-review.yml"
  workflow_dispatch:

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install geodesic and geometry runtime
        run: python -m pip install --disable-pip-version-check "shapely>=2.0,<3" "pyproj>=3.6,<4"
      - name: Check syntax
        run: python -m py_compile backend/app/services/topcon_perimeter_review.py backend/tests/test_topcon_perimeter_review.py backend/app/services/sigef_parcel_review.py backend/tests/test_sigef_parcel_review.py backend/app/services/sigef_ods_reviewed.py backend/tests/test_sigef_ods_reviewed.py backend/app/services/vertical_datum.py backend/tests/test_vertical_datum.py
      - name: Test Topcon and SIGEF parcel review
        working-directory: backend
        run: |
          python -m unittest discover -s tests -p test_topcon_perimeter_review.py -v
          python -m unittest discover -s tests -p test_sigef_parcel_review.py -v
          python -m unittest discover -s tests -p test_sigef_ods_reviewed.py -v
          python -m unittest discover -s tests -p test_vertical_datum.py -v
