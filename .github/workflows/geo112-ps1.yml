name: GEO112 PS1 and SIGEF regression
on:
  push:
    branches: [feat/geo112-ps1-simplificado-20261117]
  workflow_dispatch:
jobs:
  backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r backend/requirements.txt
      - working-directory: backend
        run: |
          python -m compileall -q app/api/routes/technical_pieces.py app/services/ps1_consolidation.py app/services/ps4_assets.py
          python -m unittest discover -s tests -p 'test_ps1_*.py' -v
          python -m unittest discover -s tests -p test_sigef_ods_reviewed.py -v
          python -m unittest discover -s tests -p 'test_topcon*.py' -v
  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm run install:ci
      - run: npx tsc --noEmit
      - run: npm run build
      - run: node --test tests/pecas-tecnicas.test.mjs
