name: GEO112 PS1 and SIGEF regression
on:
  push:
    branches: [feat/geo112-ps1-simplificado-20261117]
  workflow_dispatch:
jobs:
  backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "shapely>=2,<3" "pyproj>=3.6,<4"
      - working-directory: backend
        run: |
          python -m unittest discover -s tests -p test_ps1_accuracy.py -v
          python -m unittest discover -s tests -p test_sigef_ods_reviewed.py -v
          python -m unittest discover -s tests -p test_topcon_perimeter_review.py -v
