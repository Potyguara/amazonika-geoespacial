name: GEO90 PS4 Evidence Validation

on:
  push:
    branches:
      - feat/geo90-ps4-evidencias-20261115
  pull_request:
    branches:
      - feat/inpe-cbers4a-stac-geo90-20261115

jobs:
  ps4-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install GDAL CLI
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gdal-bin
      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Verify public INPE STAC metadata connectivity (non-blocking)
        continue-on-error: true
        env:
          PYTHONPATH: backend
        run: |
          python - <<'PY'
          from urllib.parse import urlparse
          from app.services.inpe_ps4_import import fetch_inpe_item, examine_inpe_item
          item_id = "CBERS4A_WPM_PCA_RGB321_20260410_196_132"
          try:
              item = fetch_inpe_item(item_id)
              info = examine_inpe_item(item)
              href = item["assets"][info["asset_key"]]["href"]
              print("STAC_ITEM:", info["id"])
              print("ASSET_HOST:", urlparse(href).hostname)
              print("ASSET_PATH_EXTENSION:", urlparse(href).path.rsplit(".",1)[-1])
              print("AUTO_IMPORT_ALLOWED:", info["import_supported"])
              print("SUPPORT_REASON:", info["reason"])
              print("METADATA_ASSETS:", info["metadata_assets"])
              print("RMS_DOCUMENTED:", info["report_available"])
          except Exception as exc:
              print("STAC_PUBLIC_INSPECTION_UNAVAILABLE:", type(exc).__name__, str(exc)[:200])
              raise SystemExit(1)
          PY
      - name: Live COG crop smoke — small remote subset (non-blocking)
        continue-on-error: true
        timeout-minutes: 4
        env:
          PYTHONPATH: backend
        run: python scripts/ps4_inpe_live_smoke.py
      - name: Compile PS4 modules
        run: |
          python -m py_compile backend/app/api/routes/technical_pieces.py
          python -m py_compile backend/app/services/ps4_assets.py
          python -m py_compile backend/app/services/ps4_validation.py
          python -m py_compile backend/app/services/ps4_tiles.py
      - name: Test PS4 evidence and integrity
        env:
          PYTHONPATH: backend
        run: python -m unittest discover -s backend/tests -p 'test_ps4*.py' -v
      - name: Test SIGEF ODS reviewed safeguard
        env:
          PYTHONPATH: backend
        run: python -m unittest discover -s backend/tests -p 'test_sigef_ods_reviewed.py' -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: TypeScript validation
        run: ./node_modules/.bin/tsc --noEmit -p tsconfig.ci.json
